<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Thần Đồng - Đăng Nhập</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Config -->
    <script>
      const firebaseConfig = {
        apiKey: "AiZaSyAi4_8Lsy6J3CTEU9LxFDEnppMuVEZSVF0",
        authDomain: "crmthandong-ee4db.firebaseapp.com",
        databaseURL: "https://crmthandong-ee4db-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "crmthandong-ee4db",
        storageBucket: "crmthandong-ee4db.firebasestorage.app",
        messagingSenderId: "639923839375",
        appId: "1:639923839375:web:1439554eca26cbaedd6bfa",
        measurementId: "G-TX4K73RGPP"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
    <style>
        :root {
            --primary-orange: #FF6B00;
            --primary-green: #10B981;
            --dark-orange: #E05D00;
            --white: #FFFFFF;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #FF7A00 0%, #FF5500 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: var(--gray-800); padding: 15px; }
        
        .login-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 420px; border-radius: 24px; padding: 35px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 2px solid var(--primary-orange); }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--primary-orange); letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .brand-subtitle { font-size: 13px; color: var(--primary-green); font-weight: 700; margin-top: 4px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 14px; font-weight: 700; color: var(--gray-700); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: #9CA3AF; font-size: 16px; }
        .form-control { width: 100%; padding: 12px 14px 12px 42px; border: 1.5px solid var(--gray-200); border-radius: 12px; font-size: 14px; outline: none; transition: all 0.2s ease; }
        .form-control:focus { border-color: var(--primary-orange); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15); }
        
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(90deg, var(--primary-orange) 0%, #FF8800 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3); margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 107, 0, 0.4); }
        .error-msg { background: #FEE2E2; color: #991B1B; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-title"><i class="fa-solid fa-graduation-cap"></i> THẦN ĐỒNG SIÊU NHÍ </div>
        <div class="brand-subtitle"> PORTAL SCHOOLING </div>
    </div>

    <div class="error-msg" id="login-error">Tài khoản hoặc mật khẩu không chính xác!</div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email Đăng Nhập</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" class="form-control" placeholder="nhapemail@thandong.com" required>
            </div>
        </div>

        <div class="form-group">
            <label>Mật Khẩu</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP</button>
    </form>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value.trim();
        const errorDiv = document.getElementById('login-error');
        errorDiv.style.display = 'none';

        // 1. Kiểm tra tài khoản Quản trị viên (Admin)
        if (email === 'admin@thandong.com' && pass === 'Rich@2007') {
            localStorage.setItem('user_role', 'admin');
            localStorage.setItem('admin_email', email);
            window.location.href = 'dashboardadmin.html';
            return;
        }

        // 2. Kiểm tra tài khoản Giáo viên (Được tạo từ dashboardadmin.html và lưu trên Firebase)
        database.ref('teachers').once('value', (snapshot) => {
            const data = snapshot.val();
            const teachers = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            
            // Tìm giáo viên khớp email và mật khẩu
            const foundTeacher = teachers.find(t => t.email === email && t.pass === pass);

            if (foundTeacher) {
                localStorage.setItem('user_role', 'teacher');
                localStorage.setItem('teacher_email', foundTeacher.email);
                window.location.href = 'teacherlogin.html';
            } else {
                errorDiv.innerText = 'Tài khoản hoặc mật khẩu không chính xác!';
                errorDiv.style.display = 'block';
            }
        }).catch((err) => {
            console.error(err);
            errorDiv.innerText = 'Lỗi kết nối cơ sở dữ liệu Firebase!';
            errorDiv.style.display = 'block';
        });
    }
</script>

</body>
</html>
